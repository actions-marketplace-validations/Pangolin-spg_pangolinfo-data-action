name: Weekly Amazon niche research

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: pangolinfo
        uses: Pangolin-spg/pangolinfo-data-action@v1
        with:
          token: ${{ secrets.PANGOLINFO_TOKEN }}
          product: amazon-niche
          request: |
            {
              "marketplaceId": "US",
              "searchVolumeT90Min": 10000,
              "top5BrandsClickShareMax": 0.4,
              "page": 1,
              "size": 10
            }
          output-file: research/niches.json
      - uses: actions/upload-artifact@v4
        with:
          name: amazon-niches-${{ github.run_id }}
          path: ${{ steps.pangolinfo.outputs.output-file }}
          retention-days: 30
