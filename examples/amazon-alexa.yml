name: Amazon Alexa recommendation snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: pangolinfo
        uses: Pangolin-spg/pangolinfo-data-action@v1
        with:
          token: ${{ secrets.PANGOLINFO_TOKEN }}
          product: amazon-alexa
          request: |
            {
              "parserName": "amazonAlexa",
              "param": [
                "Recommend a quiet portable fan under $30",
                "Which option is best for a bedroom?"
              ],
              "url": "https://www.amazon.com/",
              "screenshot": false
            }
          output-file: research/alexa-shopping.json
      - uses: actions/upload-artifact@v4
        with:
          name: alexa-shopping-${{ github.run_id }}
          path: ${{ steps.pangolinfo.outputs.output-file }}
          retention-days: 14
